name: Release

on:
  push:
    tags:
      - 'v*'
  # Lets a single platform be built on demand, without cutting a new version.
  workflow_dispatch:
    inputs:
      platforms:
        description: Which installers to build
        type: choice
        default: linux
        options:
          - linux
          - windows
          - mac
          - all

# Needed to create the release and upload installers to it.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # A tag push has to match package.json. A manual run carries no tag of its
      # own, so it publishes into the tag for the version package.json already has.
      - name: Work out which release to publish into
        id: target
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
              exit 1
            fi
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$PKG_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      # Created here, once, so the build jobs below do not race to create it.
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          VERSION="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" \
              --title "Priama $VERSION" \
              --latest \
              --notes-file .github/release-notes.md
          fi

  windows:
    needs: prepare
    if: >-
      github.event_name == 'push'
      || github.event.inputs.platforms == 'all'
      || github.event.inputs.platforms == 'windows'
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Build, package, and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:win -- --x64 --publish always

  linux:
    needs: prepare
    if: >-
      github.event_name == 'push'
      || github.event.inputs.platforms == 'all'
      || github.event.inputs.platforms == 'linux'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

      - name: Install Linux packagers
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg

      - run: npm ci

      # electron-builder will not publish into a release that is more than two
      # hours old, which every past release is. Package first, attach with gh.
      - name: Build and package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:linux -- --publish never

      - name: Attach the installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.prepare.outputs.tag }}" release/*.AppImage release/*.deb --clobber

  mac:
    needs: prepare
    if: >-
      github.event_name == 'push'
      || github.event.inputs.platforms == 'all'
      || github.event.inputs.platforms == 'mac'
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Build, package, and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:mac -- --publish always

  # The three build jobs finish at different times, so none of them can own the
  # release notes — three concurrent edits would clobber each other. This runs
  # once, last, and describes whatever actually ended up attached.
  notes:
    needs: [prepare, windows, linux, mac]
    # A manual single-platform run skips the other two build jobs, and a failed
    # build should still leave honest notes for the installers that did upload.
    # Only a cancelled run or a failed `prepare` means there is nothing to say.
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No checkout: GH_REPO is all `gh` needs to find the release, and this job
      # reads nothing out of the tree.
      - name: Give every installer a checksum in the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          # Fences off the block this job owns, so a changelog written by hand
          # survives a re-run. Invisible in the rendered notes.
          MARK: '<!-- checksums: written by the release workflow, replaced on every run -->'
        run: |
          # GitHub publishes a sha256 for every asset it stores, so the hashes
          # come from the API rather than from pulling ~600MB back down. That
          # also means no half-finished download can ever put the hash of a
          # truncated file into the notes.
          gh api "repos/$GH_REPO/releases/tags/$TAG" \
            --jq '.assets[] | select(.name | test("\\.(dmg|exe|AppImage|deb)$")) | [.name, .digest] | @tsv' \
            | sort > assets.tsv

          if [ ! -s assets.tsv ]; then
            echo "No installers are attached to $TAG, so there is nothing to checksum."
            exit 0
          fi

          # Fail loudly rather than publish a table that quietly skips a file:
          # the heading promises a hash for everything a reader can download.
          if cut -f2 assets.tsv | grep -qvx 'sha256:[0-9a-f]\{64\}'; then
            echo "GitHub reported no usable sha256 for at least one asset:"
            cat assets.tsv
            exit 1
          fi

          # The body belongs to whoever wrote it. A changelog typed on the
          # release page exists nowhere else and GitHub keeps no history of it,
          # so keep everything above the marker and replace only what follows.
          gh release view "$TAG" --json body --jq '.body' > body.md
          # Stop at the marker, or at a bare "## Checksums" — notes written
          # before the marker existed, or by hand, end the same way.
          awk -v m="$MARK" '$0 == m || $0 == "## Checksums" { exit } { print }' \
            body.md > kept.md
          printf '%s\n' "$(cat kept.md)" > notes.md

          {
            printf '\n%s\n\n' "$MARK"
            cat <<'EOF'
          ## Checksums

          Check a download before you install it:

          ```
          shasum -a 256 <file>              # macOS
          sha256sum <file>                  # Linux
          certutil -hashfile <file> SHA256  # Windows
          ```

          | File | SHA-256 |
          | --- | --- |
          EOF
            while IFS="$(printf '\t')" read -r name digest; do
              # The backticks are literal markdown for the table cell, not an
              # attempt at command substitution.
              # shellcheck disable=SC2016
              printf '| `%s` | `%s` |\n' "$name" "${digest#sha256:}"
            done < assets.tsv
          } >> notes.md

          cat notes.md
          gh release edit "$TAG" --notes-file notes.md
