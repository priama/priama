name: Release

on:
  push:
    tags:
      - 'v*'
  # Lets a single platform be built on demand, without cutting a new version.
  workflow_dispatch:
    inputs:
      platforms:
        description: Which installers to build
        type: choice
        default: linux
        options:
          - linux
          - windows
          - mac
          - all

# Needed to create the release and upload installers to it.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # A tag push has to match package.json. A manual run carries no tag of its
      # own, so it publishes into the tag for the version package.json already has.
      - name: Work out which release to publish into
        id: target
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
              exit 1
            fi
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$PKG_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      # Created here, once, so the build jobs below do not race to create it.
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          VERSION="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" \
              --title "Priama $VERSION" \
              --latest \
              --notes "Installers for this version. Builds are unsigned — on macOS right-click the app and choose Open the first time; on Windows choose More info, then Run anyway."
          fi

  windows:
    needs: prepare
    if: >-
      github.event_name == 'push'
      || github.event.inputs.platforms == 'all'
      || github.event.inputs.platforms == 'windows'
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Build, package, and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:win -- --x64 --publish always

  linux:
    needs: prepare
    if: >-
      github.event_name == 'push'
      || github.event.inputs.platforms == 'all'
      || github.event.inputs.platforms == 'linux'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

      - name: Install Linux packagers
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg

      - run: npm ci

      # electron-builder will not publish into a release that is more than two
      # hours old, which every past release is. Package first, attach with gh.
      - name: Build and package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:linux -- --publish never

      - name: Attach the installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.prepare.outputs.tag }}" release/*.AppImage release/*.deb --clobber

  mac:
    needs: prepare
    if: >-
      github.event_name == 'push'
      || github.event.inputs.platforms == 'all'
      || github.event.inputs.platforms == 'mac'
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Build, package, and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:mac -- --publish always
